<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Producto | Sofi_Nach</title><link rel="stylesheet" href="estilos.css"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html">Sofi_Nach<small>BALDOSAS DE HORMIGÓN</small></a><nav class="links"><a href="index.html">INICIO</a><a href="catalogo.html">CATÁLOGO</a><a href="#usos">USOS</a><a href="#contacto">CONTACTO</a></nav></div></header><main class="wrap"><a class="back" href="catalogo.html">← Volver al catálogo</a><section id="detail" class="detail"></section></main><footer class="footer" id="contacto"><div class="wrap"><strong>Sofi_Nach · Ideas que perduran</strong><span>San José, Uruguay</span><span>WhatsApp · Instagram</span></div></footer><script>const id=new URLSearchParams(location.search).get('id')||'SN-01';fetch('productos.json').then(r=>r.json()).then(ps=>{const p=ps.find(x=>x.id===id)||ps[0];document.title=p.id+' '+p.name+' | Sofi_Nach';const msg=encodeURIComponent('Hola, quisiera consultar precio y disponibilidad de '+p.id+' - '+p.name);document.querySelector('#detail').innerHTML=`<div><img src="${p.image}" alt="${p.id} ${p.name}"></div><div><span class="code">${p.id}</span><h1>${p.name}</h1><div class="specbox"><p><b>Medidas:</b> ${p.medidas}</p><p><b>Espesor:</b> ${p.espesor}</p><p><b>Color:</b> ${p.color}</p><p><b>Terminación:</b> ${p.terminacion}</p><p><b>Uso recomendado:</b> ${p.uso}</p></div><a class="btn wa" href="https://wa.me/?text=${msg}" target="_blank">Consultar por WhatsApp</a></div>`})</script></body></html>
